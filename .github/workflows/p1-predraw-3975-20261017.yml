name: P1 draw 3975 Thursday 2026-10-15 pre-draw experiment

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p1-predraw-3975-20261017.yml

permissions:
  contents: read

jobs:
  freeze-paper-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e .
      - name: Fail closed unless draw 3974 is the latest and target is future
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          from lrei.lottery.dataset import CsvDatasetLoader, parse_draw_date
          dataset = CsvDatasetLoader().load(Path("data/lottery.csv"))
          target = datetime.fromisoformat("2026-10-15T23:00:00+03:00")
          assert datetime.now(timezone.utc) < target.astimezone(timezone.utc), "target already elapsed"
          assert dataset.latest().draw_id == "3974", "stale or unexpected training cutoff"
          assert parse_draw_date(dataset.latest().date).isoformat() == "2026-10-13"
          assert len(dataset) == 1141
          print("Prospective gate: pre-draw 3975, dataset cutoff 3974")
          PY
      - name: Freeze the actual LREI Smart 5+ output, seed 42
        run: |
          mkdir -p predraw-3975
          python -m lrei recommend \
            --mode smart --objective coverage_5plus \
            --tickets 14 --seed 42 \
            --snapshot-dir predraw-3975 \
            --target-draw-at "2026-10-15T23:00:00+03:00" \
            > predraw-3975/smart-cli-output.txt
      - name: Freeze independent same-size random paper baseline and audit hashes
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from hashlib import sha256
          import json
          from pathlib import Path
          import random
          import subprocess
          from lrei.lottery.prospective_ledger import verify_snapshot
          root = Path("predraw-3975")
          files = list(root.glob("predraw-*.json"))
          assert len(files) == 1, "Smart must produce exactly one prospective record"
          smart = json.loads(files[0].read_text(encoding="utf-8"))
          assert verify_snapshot(smart), "Smart ledger record SHA mismatch"
          assert smart["latest_draw"] == {"id": "3974", "date": "2026-10-13"}
          assert smart["mode"] == "smart" and smart["objective"] == "coverage_5plus"
          assert len(smart["tickets"]) == 14
          assert smart["target_draw_date_local"] == "2026-10-15"
          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert source == smart["source_commit"]
          actual_dataset_hash = sha256(Path("data/lottery.csv").read_bytes()).hexdigest()
          assert actual_dataset_hash == smart["dataset_sha256"]
          target = datetime.fromisoformat("2026-10-15T23:00:00+03:00")
          now = datetime.now(timezone.utc)
          assert now < target.astimezone(timezone.utc), "cannot create a baseline after draw cutoff"
          rng = random.Random(42)
          lines = []
          seen = set()
          while len(lines) < 14:
              main = tuple(sorted(rng.sample(range(1, 38), 6)))
              if main in seen:
                  continue
              seen.add(main)
              lines.append({"main": list(main), "strong": rng.randint(1, 7)})
          record = {
              "schema_version": 1,
              "experiment": "prospective_3975_paper_only",
              "baseline": "uniform_random_14_independent_of_draw_history",
              "created_at_utc": now.isoformat().replace("+00:00", "Z"),
              "target_draw_at_utc": target.astimezone(timezone.utc).isoformat().replace("+00:00", "Z"),
              "target_draw_date_local": "2026-10-15",
              "expected_next_draw_id": "3975",
              "source_commit": source,
              "dataset_sha256": actual_dataset_hash,
              "latest_draw": smart["latest_draw"],
              "seed": 42,
              "ticket_count": 14,
              "tickets": lines,
              "real_money_spent": 0,
              "candidate_only_source_provenance_pending": True,
          }
          canonical = json.dumps(record, sort_keys=True, ensure_ascii=False, separators=(",", ":"))
          record["record_sha256"] = sha256(canonical.encode("utf-8")).hexdigest()
          with (root / "uniform-random-baseline.json").open("x", encoding="utf-8") as f:
              f.write(json.dumps(record, sort_keys=True, ensure_ascii=False, indent=2) + "\n")
          print("Smart source:", source)
          print("Smart 14 ticket hash:", smart["record_sha256"])
          print("Random 14 ticket hash:", record["record_sha256"])
          print("Prospective evidence only; no predictor advantage proven.")
          PY
      - name: Archive prospective paper snapshots with GitHub run timestamp
        uses: actions/upload-artifact@v4
        with:
          name: P1-paper-snapshots-3975-smart-vs-random
          path: predraw-3975/
          if-no-files-found: error
          retention-days: 90
