name: Run LREI Recommendation

on:
  workflow_dispatch:
    inputs:
      objective:
        description: "Smart portfolio objective"
        required: true
        type: choice
        default: coverage_any_prize
        options:
          - coverage_any_prize
          - coverage_4plus
          - historical
      seed:
        description: "Reproducible random seed"
        required: true
        type: string
        default: "42"

permissions:
  contents: read

jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Generate 14 Smart tickets
        env:
          LREI_OBJECTIVE: ${{ inputs.objective }}
          LREI_SEED: ${{ inputs.seed }}
        run: |
          python -m lrei recommend --mode smart --objective "$LREI_OBJECTIVE" --tickets 14 --seed "$LREI_SEED"
