name: P1 Real Browser Upload and Download (PAPER ONLY)

on:
  pull_request:
    branches: [main]
    paths:
      - app.py
      - data/lottery.csv
      - tests/ui/**
      - pyproject.toml
      - .github/workflows/p1-streamlit-browser-e2e.yml
  push:
    branches: [main]
    paths:
      - app.py
      - data/lottery.csv
      - tests/ui/**
      - pyproject.toml
      - .github/workflows/p1-streamlit-browser-e2e.yml

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LREI_BROWSER_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install UI, test dependencies and Playwright
        run: python -m pip install -e '.[ui]' pytest playwright
      - name: Install real Chromium browser and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Upload existing data, generate fourteen paper tickets and download TXT
        run: python -m pytest -q tests/ui/test_streamlit_browser_e2e.py
