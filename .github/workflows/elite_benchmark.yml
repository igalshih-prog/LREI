name: Elite benchmark
# 2026-10-03: rerun diagnostics after pytest slow-marker configuration fix.
# 2026-09-28: rerun full Elite model-selection suite on current production head.
# 2026-09-20: split expensive Elite diagnostics into parallel jobs so long
# walk-forward experiments do not cancel the whole benchmark suite.

on:
  push:
    branches: [main]
    paths:
      - "src/lrei/lottery/**"
      - "data/lottery.csv"
      - "tests/lottery/test_elite_vs_pro_random.py"
      - "tests/lottery/test_elite_pro.py"
      - ".github/workflows/elite_benchmark.yml"
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e . pytest
      - name: Run core Elite benchmark
        run: python -m pytest tests/lottery/test_elite_vs_pro_random.py -q -s -k "elite_against_pro_and_multiple_random_baselines_walk_forward"

  robust_baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest
      - run: python -m pytest tests/lottery/test_elite_vs_pro_random.py -q -s -k "robust_baseline_walk_forward_diagnostic or candidate_allocation_robust_walk_forward_diagnostic or adaptive_candidate_allocation_robust_walk_forward_diagnostic"

  robust_signals:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest
      - run: python -m pytest tests/lottery/test_elite_vs_pro_random.py -q -s -k "number_signal_strength_robust_walk_forward_diagnostic or portfolio_hit_threshold_walk_forward_diagnostic or elite_tail_focused_portfolio_selection_walk_forward_diagnostic or elite_momentum_signal_robust_walk_forward_diagnostic or elite_adaptive_momentum_robust_walk_forward_diagnostic"

  strong_number:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest
      - run: python -m pytest tests/lottery/test_elite_pro.py -q -s -k "adaptive_strong_number"

  robust_ensemble:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest
      - run: python -m pytest tests/lottery/test_elite_vs_pro_random.py -q -s -k "elite_consensus_scoring_robust_walk_forward_diagnostic or elite_signal_enhancement_robust_walk_forward_diagnostic or elite_prize_tier_robust_walk_forward_diagnostic or elite_hit_tail_distribution_robust_diagnostic or elite_overlap_limit_tail_robust_walk_forward_diagnostic"

  robust_model:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest
      - run: python -m pytest tests/lottery/test_elite_vs_pro_random.py -q -s -k "elite_meta_model_multi_origin_stability_diagnostic or elite_learned_signal_model_robust_walk_forward_diagnostic or elite_tail_weight_robust_walk_forward_diagnostic or learned_logistic_signal_robust_walk_forward_diagnostic or elite_against_constrained_random_jackpot_walk_forward"

  model_selection_clean:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest
      - run: python -m pytest tests/lottery/test_elite_vs_pro_random.py -q -s -k "clean_model_selection_regular_pro_elite_walk_forward"

  model_selection_features:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest
      - run: python -m pytest tests/lottery/test_elite_vs_pro_random.py -q -s -k "elite_feature_ablation_walk_forward_diagnostic"

  model_selection_meta:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest
      - run: python -m pytest tests/lottery/test_elite_vs_pro_random.py -q -s -k "elite_meta_model_selection_walk_forward_diagnostic"

  ablations_core:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e . pytest
      - name: Run candidate/weight diagnostics
        run: python -m pytest tests/lottery/test_elite_pro.py -q -s -k "candidate_pool_diversity or weighting_ablation_diagnostic or candidate_allocation_ablation_diagnostic"

  ablations_calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e . pytest
      - name: Run candidate calibration diagnostics
        run: python -m pytest tests/lottery/test_elite_pro.py -q -s -k "candidate_calibration_origin_ablation_diagnostic or elite_recent_affinity_multi_origin_robust_diagnostic or elite_gap_signal_multi_origin_robust_diagnostic"

  ablations_features:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e . pytest
      - name: Run portfolio/feature diagnostics
        run: python -m pytest tests/lottery/test_elite_pro.py -q -s -k "elite_portfolio_pair_triple_coverage_walk_forward_diagnostic or elite_adaptive_consensus_multi_origin_robust_diagnostic or elite_adaptive_feature_stack_multi_origin_diagnostic"


  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e . pytest
      - name: Run multi-origin score calibration diagnostic
        run: python -m pytest tests/lottery/test_elite_pro.py -q -s -k "score_calibration_multi_origin_robust_diagnostic or elite_momentum_multi_origin_robust_diagnostic"


  model_selection_margin:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest
      - run: python -m pytest tests/lottery/test_elite_vs_pro_random.py -q -s -k "elite_conservative_meta_selector_margin_diagnostic"
