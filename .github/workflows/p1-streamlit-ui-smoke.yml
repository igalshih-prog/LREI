name: P1 Streamlit UI smoke

on:
  pull_request:
    branches: [main]
    paths:
      - app.py
      - tests/ui/**
      - .github/workflows/p1-streamlit-ui-smoke.yml
      - pyproject.toml
      - data/lottery.csv
  push:
    branches: [main]
    paths:
      - app.py
      - tests/ui/**
      - .github/workflows/p1-streamlit-ui-smoke.yml
      - pyproject.toml
      - data/lottery.csv

permissions:
  contents: read

jobs:
  headless-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install actual Streamlit UI and pytest
        run: python -m pip install -e '.[ui]' pytest
      - name: Exercise startup, mode changes and real Smart 5+ generation (paper only)
        run: python -m pytest -q tests/ui
