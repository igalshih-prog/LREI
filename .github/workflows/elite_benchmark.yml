name: Elite benchmark
# Elite benchmark is intentionally retriggered with workflow changes.
# 2026-09-20: rerun the full walk-forward diagnostics after the latest tail-focused analysis.

on:
  push:
    branches: [main]
    paths:
      - "src/lrei/lottery/**"
      - "data/lottery.csv"
      - "tests/lottery/test_elite_vs_pro_random.py"
      - "tests/lottery/test_elite_pro.py"
      - ".github/workflows/elite_benchmark.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e . pytest
      - name: Run Elite vs Pro vs random benchmark
        run: python -m pytest tests/lottery/test_elite_vs_pro_random.py -q -s -k "elite_against_pro_and_multiple_random_baselines_walk_forward or elite_robust_baseline_walk_forward_diagnostic or elite_candidate_allocation_robust_walk_forward_diagnostic or elite_adaptive_candidate_allocation_robust_walk_forward_diagnostic or elite_number_signal_strength_robust_walk_forward_diagnostic or portfolio_hit_threshold_walk_forward_diagnostic or elite_tail_focused_portfolio_selection_walk_forward_diagnostic"
      - name: Run Elite candidate diversity diagnostic
        run: python -m pytest tests/lottery/test_elite_pro.py -q -s -k "candidate_pool_diversity or weighting_ablation_diagnostic or candidate_allocation_ablation_diagnostic"
