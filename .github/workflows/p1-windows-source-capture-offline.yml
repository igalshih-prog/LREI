name: P1 Windows Offline Source Capture Tests

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/LREI_capture_pais_latest_v4.ps1
      - tests/windows/test_capture_pais_offline.ps1
      - .github/workflows/p1-windows-source-capture-offline.yml
  push:
    branches: [main]
    paths:
      - scripts/LREI_capture_pais_latest_v4.ps1
      - tests/windows/test_capture_pais_offline.ps1
      - .github/workflows/p1-windows-source-capture-offline.yml

permissions:
  contents: read

jobs:
  offline-windows-powershell-5:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify PowerShell syntax and run synthetic offline fixture
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            'scripts\LREI_capture_pais_latest_v4.ps1',
            'tests\windows\test_capture_pais_offline.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax error in $script : $($errors | Out-String)"
            }
          }
          & .\tests\windows\test_capture_pais_offline.ps1
      - name: Confirm test did not contact operator or approve source
        shell: powershell
        run: |
          Write-Host 'Offline Windows functions only; no network or actual operator capture attempted.'
          Write-Host 'No dataset or draw is promoted by this workflow.'
