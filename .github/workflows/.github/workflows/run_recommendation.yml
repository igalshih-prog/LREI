name: Run LREI Recommendation

on:
  workflow_dispatch:

jobs:
  recommend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run LREI recommendation engine
        run: |
          python -m lrei.lottery.run_recommendation
