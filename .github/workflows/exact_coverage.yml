name: Exact portfolio coverage

on:
  push:
    branches: [main]
    paths:
      - "src/lrei/lottery/**"
      - "data/lottery.csv"
      - "tests/lottery/test_elite_portfolio_coverage.py"
      - "tests/lottery/test_portfolio_coverage.py"
      - "tests/lottery/test_coverage_engine.py"
      - ".github/workflows/exact_coverage.yml"
  workflow_dispatch:

jobs:
  exact_coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e . pytest
      - name: Verify exact coverage calculation
        run: python -m pytest tests/lottery/test_portfolio_coverage.py tests/lottery/test_elite_portfolio_coverage.py tests/lottery/test_coverage_engine.py -q -s
