name: Smart model selection benchmark

on:
  push:
    branches: [main]
    paths:
      - "src/lrei/lottery/smart.py"
      - "src/lrei/lottery/elite.py"
      - "src/lrei/lottery/pro.py"
      - "tests/lottery/test_smart.py"
      - "data/lottery.csv"
      - ".github/workflows/smart_benchmark.yml"
  workflow_dispatch:

jobs:
  smart:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest
      - run: python -m pytest tests/lottery/test_smart.py -q -s -k "not smart_calibration_multi_origin_robust_diagnostic and not smart_tail_metric_robust_walk_forward_diagnostic"
      - name: Run robust Smart calibration diagnostic
        run: python -m pytest tests/lottery/test_smart.py -q -s -k "smart_calibration_multi_origin_robust_diagnostic"
      - name: Run robust Smart tail diagnostic\n        run: python -m pytest tests/lottery/test_smart.py -q -s -k "smart_tail_metric_robust_walk_forward_diagnostic"\n