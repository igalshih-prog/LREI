name: Elite benchmark
# 2026-10-03: rerun diagnostics after pytest slow-marker configuration fix.
# 2026-09-28: rerun full Elite model-selection suite on current production head.
# 2026-09-20: split expensive Elite diagnostics into parallel jobs so long
# walk-forward experiments do not cancel the whole benchmark suite.

on:
  push:
    branches: [main]
    paths:
      - "src/lrei/lottery/**"
      - "data/lottery.csv"
      - "tests/lottery/test_elite_vs_pro_random.py"
      - "tests/lottery/test_elite_pro.py"
      - ".github/workflows/elite_benchmark.yml"
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e . pytest
      - name: Run core Elite benchmark
        run: python -m pytest tests/lottery/test_elite_vs_pro_random.py -q -s -k "elite_against_pro_and_multiple_random_baselines_walk_forward"

  robust:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e . pytest
      - name: Run robust walk-forward diagnostics
        run: python -m pytest tests/lottery/test_elite_vs_pro_random.py -q -s -k "robust_baseline_walk_forward_diagnostic or candidate_allocation_robust_walk_forward_diagnostic or adaptive_candidate_allocation_robust_walk_forward_diagnostic or number_signal_strength_robust_walk_forward_diagnostic or portfolio_hit_threshold_walk_forward_diagnostic or elite_tail_focused_portfolio_selection_walk_forward_diagnostic or elite_momentum_signal_robust_walk_forward_diagnostic or elite_adaptive_momentum_robust_walk_forward_diagnostic or elite_consensus_scoring_robust_walk_forward_diagnostic or elite_signal_enhancement_robust_walk_forward_diagnostic or elite_prize_tier_robust_walk_forward_diagnostic or elite_hit_tail_distribution_robust_diagnostic or elite_overlap_limit_tail_robust_walk_forward_diagnostic"

  ablations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e . pytest
      - name: Run Elite candidate diagnostics
        run: python -m pytest tests/lottery/test_elite_pro.py -q -s -k "candidate_pool_diversity or weighting_ablation_diagnostic or candidate_allocation_ablation_diagnostic or candidate_calibration_origin_ablation_diagnostic or elite_recent_affinity_multi_origin_robust_diagnostic or elite_gap_signal_multi_origin_robust_diagnostic or elite_portfolio_pair_triple_coverage_walk_forward_diagnostic or elite_adaptive_consensus_multi_origin_robust_diagnostic or elite_adaptive_feature_stack_multi_origin_diagnostic"


  model_selection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e . pytest
      - name: Run clean production model-selection diagnostic
        run: python -m pytest tests/lottery/test_elite_vs_pro_random.py -q -s -k "clean_model_selection_regular_pro_elite_walk_forward or adaptive_candidate_allocation_robust_walk_forward_diagnostic or elite_adaptive_candidate_allocation_robust_walk_forward_diagnostic or elite_feature_stack_multi_origin_diagnostic"



  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e . pytest
      - name: Run multi-origin score calibration diagnostic
        run: python -m pytest tests/lottery/test_elite_pro.py -q -s -k "score_calibration_multi_origin_robust_diagnostic or elite_momentum_multi_origin_robust_diagnostic"
