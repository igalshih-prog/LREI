name: P3 Forward Discovery Ledger Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - data/p3_forward_missingness/**
      - src/lrei/lottery/p3_forward_evidence_events.py
      - tests/lottery/test_p3_forward_evidence_events.py
      - src/lrei/lottery/p3_forward_missingness.py
      - src/lrei/lottery/p3_forward_screen.py
      - tests/lottery/test_p3_forward_missingness.py
      - research/protocols/p3-strong-choice-forward-screen-v1.json
      - .github/workflows/p3-forward-missingness.yml
  push:
    branches: [main]
    paths:
      - data/p3_forward_missingness/**
      - src/lrei/lottery/p3_forward_evidence_events.py
      - tests/lottery/test_p3_forward_evidence_events.py
      - src/lrei/lottery/p3_forward_missingness.py
      - src/lrei/lottery/p3_forward_screen.py
      - tests/lottery/test_p3_forward_missingness.py
      - research/protocols/p3-strong-choice-forward-screen-v1.json
      - .github/workflows/p3-forward-missingness.yml

permissions:
  contents: read

jobs:
  discovery-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR merge ref with baseline commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and pytest
        run: python -m pip install -e . pytest

      - name: Compile and run source-gated regression tests
        run: |
          python -m compileall -q src/lrei/lottery/p3_forward_missingness.py src/lrei/lottery/p3_forward_evidence_events.py
          python -m pytest -q tests/lottery/test_p3_forward_missingness.py tests/lottery/test_p3_forward_evidence_events.py

      - name: Verify proposed discovery ledger against base branch (append-only)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          path='data/p3_forward_missingness/source_blocked_candidates.json'
          # A missing baseline is not silently treated as an empty archive.
          git cat-file -e "${BASE_SHA}:${path}"
          git show "${BASE_SHA}:${path}" > "${RUNNER_TEMP}/p3-previous-ledger.json"
          python -m lrei.lottery.p3_forward_missingness \
            --ledger "${path}" \
            --previous-ledger "${RUNNER_TEMP}/p3-previous-ledger.json" \
            --protocol research/protocols/p3-strong-choice-forward-screen-v1.json

      - name: Validate append-only source-evidence events (NOT source admission)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --events data/p3_forward_missingness/source_evidence_events.json
            --ledger data/p3_forward_missingness/source_blocked_candidates.json
            --protocol research/protocols/p3-strong-choice-forward-screen-v1.json
          )
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # The event log has already been bootstrapped on main. Never allow
            # a missing baseline to be interpreted as an empty event history.
            file='data/p3_forward_missingness/source_evidence_events.json'
            git cat-file -e "${BASE_SHA}:${file}"
            git show "${BASE_SHA}:${file}" > "${RUNNER_TEMP}/previous-p3-events.json"
            args+=(--previous-events "${RUNNER_TEMP}/previous-p3-events.json")
          fi
          python -m lrei.lottery.p3_forward_evidence_events "${args[@]}"

      - name: Verify both P3 histories append-only on main push (not source admission)
        if: github.event_name == 'push'
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          # Do not silently accept a missing, malformed or all-zero push base.
          if [[ ! "${PREVIOUS_SHA}" =~ ^[a-f0-9]{40}$ ]] ||
             [[ "${PREVIOUS_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            echo "REFUSED: missing previous main commit" >&2
            exit 2
          fi
          original='data/p3_forward_missingness/source_blocked_candidates.json'
          events='data/p3_forward_missingness/source_evidence_events.json'
          git cat-file -e "${PREVIOUS_SHA}:${original}"
          git cat-file -e "${PREVIOUS_SHA}:${events}"
          git show "${PREVIOUS_SHA}:${original}" > "${RUNNER_TEMP}/previous-discovery.json"
          git show "${PREVIOUS_SHA}:${events}" > "${RUNNER_TEMP}/previous-evidence-events.json"
          python -m lrei.lottery.p3_forward_missingness \
            --ledger "${original}" \
            --previous-ledger "${RUNNER_TEMP}/previous-discovery.json" \
            --protocol research/protocols/p3-strong-choice-forward-screen-v1.json
          python -m lrei.lottery.p3_forward_evidence_events \
            --events "${events}" \
            --ledger "${original}" \
            --protocol research/protocols/p3-strong-choice-forward-screen-v1.json \
            --previous-events "${RUNNER_TEMP}/previous-evidence-events.json"
