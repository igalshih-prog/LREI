name: P2 Prospective Bias Evidence Checks

on:
  pull_request:
    branches: [main]
    paths:
      - src/lrei/lottery/bias_evidence.py
      - src/lrei/cli.py
      - tests/lottery/test_bias_evidence.py
      - .github/workflows/p2-bias-evidence.yml
  push:
    branches: [main]
    paths:
      - src/lrei/lottery/bias_evidence.py
      - src/lrei/cli.py
      - tests/lottery/test_bias_evidence.py
      - .github/workflows/p2-bias-evidence.yml

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test runner
        run: python -m pip install -e . pytest
      - name: Compile prospective evidence and CLI modules
        run: python -m compileall -q src/lrei/lottery/bias_evidence.py src/lrei/cli.py
      - name: Run prospective-only pre-registration tests
        run: >-
          python -m pytest -q
          tests/lottery/test_bias_evidence.py
          tests/lottery/test_prospective_ledger.py
          tests/lottery/test_prospective_scoring.py
          tests/test_cli_snapshot.py
