name: P3-A.2 Prize Series Audit

on:
  pull_request:
    branches: [main]
    paths:
      - src/lrei/lottery/prize_series_audit.py
      - src/lrei/lottery/prize_data.py
      - src/lrei/lottery/prize_aggregate_crosscheck.py
      - tests/lottery/test_prize_aggregate_crosscheck.py
      - src/lrei/lottery/prize_capture_intake.py
      - tests/lottery/test_prize_capture_intake.py
      - src/lrei/lottery/source_capture_check.py
      - tests/lottery/test_source_capture_check.py
      - src/lrei/lottery/prize_research_checks.py
      - tests/lottery/test_prize_research_checks.py
      - data/prize_leads/**
      - data/prize_rule_notices/**
      - tests/lottery/test_prize_series_audit.py
      - tests/lottery/test_prize_data.py
      - data/prize_observations/**
      - src/lrei/lottery/prize_official_reply_intake.py
      - tests/lottery/test_prize_official_reply_intake.py
      - data/prize_request_templates/**
      - tests/lottery/test_official_prize_request_template.py
      - data/prize_audit/**
      - .github/workflows/p3a2-prize-audit.yml
  push:
    branches: [main]
    paths:
      - src/lrei/lottery/prize_series_audit.py
      - src/lrei/lottery/prize_data.py
      - src/lrei/lottery/prize_aggregate_crosscheck.py
      - tests/lottery/test_prize_aggregate_crosscheck.py
      - src/lrei/lottery/prize_capture_intake.py
      - tests/lottery/test_prize_capture_intake.py
      - src/lrei/lottery/source_capture_check.py
      - tests/lottery/test_source_capture_check.py
      - src/lrei/lottery/prize_research_checks.py
      - tests/lottery/test_prize_research_checks.py
      - data/prize_leads/**
      - data/prize_rule_notices/**
      - tests/lottery/test_prize_series_audit.py
      - tests/lottery/test_prize_data.py
      - data/prize_observations/**
      - src/lrei/lottery/prize_official_reply_intake.py
      - tests/lottery/test_prize_official_reply_intake.py
      - data/prize_request_templates/**
      - tests/lottery/test_official_prize_request_template.py
      - data/prize_audit/**
      - .github/workflows/p3a2-prize-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install application and pytest
        run: python -m pip install -e . pytest
      - name: Compile audit code
        run: python -m compileall -q src/lrei/lottery/prize_series_audit.py src/lrei/lottery/prize_data.py src/lrei/lottery/prize_research_checks.py src/lrei/lottery/source_capture_check.py src/lrei/lottery/prize_capture_intake.py src/lrei/lottery/prize_aggregate_crosscheck.py src/lrei/lottery/prize_official_reply_intake.py
      - name: Test individual prize records and audit
        run: >-
          python -m pytest -q
          tests/lottery/test_prize_data.py
          tests/lottery/test_prize_series_audit.py
          tests/lottery/test_prize_research_checks.py
          tests/lottery/test_source_capture_check.py
          tests/lottery/test_prize_capture_intake.py
          tests/lottery/test_prize_aggregate_crosscheck.py
          tests/lottery/test_official_prize_request_template.py
          tests/lottery/test_prize_official_reply_intake.py
      - name: Validate archived observations without web fetching
        run: >-
          python -m lrei.lottery.prize_series_audit
          --observations-dir data/prize_observations
          --manifest data/prize_audit/3949-3968.manifest.json
          --historical-csv data/lottery.csv
          --report audit-evidence/p3a2-research-readiness.json
      - name: Upload descriptive P3-A readiness report (NO PLAY; not source proof)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3a2-research-readiness
          path: audit-evidence/p3a2-research-readiness.json
          if-no-files-found: warn
          retention-days: 30
