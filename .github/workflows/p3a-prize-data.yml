name: P3-A Prize Data Contract

on:
  pull_request:
    branches: [main]
    paths:
      - src/lrei/lottery/prize_data.py
      - data/prize_observations/**
      - tests/lottery/test_prize_data.py
      - .github/workflows/p3a-prize-data.yml
  push:
    branches: [main]
    paths:
      - src/lrei/lottery/prize_data.py
      - data/prize_observations/**
      - tests/lottery/test_prize_data.py
      - .github/workflows/p3a-prize-data.yml

permissions:
  contents: read

jobs:
  prize-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project test requirements
        run: python -m pip install -e . pytest
      - name: Compile prize-data schema
        run: python -m compileall -q src/lrei/lottery/prize_data.py
      - name: Check observation against draw history
        run: python -m pytest -q tests/lottery/test_prize_data.py
