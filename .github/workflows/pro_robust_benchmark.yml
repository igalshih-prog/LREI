name: Pro robust benchmark
# Robust benchmark is intentionally retriggered with workflow changes.

on:
  push:
    branches: [main]
    paths:
      - "src/lrei/lottery/**"
      - "data/lottery.csv"
      - "tests/lottery/test_pro_random_baseline_robust.py"
      - ".github/workflows/pro_robust_benchmark.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e . pytest
      - name: Run robust Pro vs random benchmark
        run: python -m pytest tests/lottery/test_pro_random_baseline_robust.py -q -s
