name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Install test dependencies
        run: pip install pytest

      - name: Compile application and source modules
        run: python -m compileall -q app.py src

      - name: Run tests
        run: python -m pytest -rA -m "not slow" --junitxml=fast-tests.xml -o junit_logging=all
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-tests
          path: fast-tests.xml

  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test runner
        run: python -m pip install -e . pytest pytest-xdist
      - name: Run every slow test in deterministic partitions
        run: >-
          python -m pytest -n 2 -rA -m slow
          --shard-count=4 --shard-index=${{ matrix.shard }}
          --junitxml=slow-tests-${{ matrix.shard }}.xml -o junit_logging=all
      - name: Save diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slow-tests-${{ matrix.shard }}
          path: slow-tests-${{ matrix.shard }}.xml
