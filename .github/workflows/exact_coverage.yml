name: Exact portfolio coverage and Coverage mode

on:
  push:
    branches: [main]
    paths:
      - "src/lrei/lottery/**"
      - "app.py"
      - "data/lottery.csv"
      - "tests/lottery/test_elite_portfolio_coverage.py"
      - "tests/lottery/test_portfolio_coverage.py"
      - "tests/lottery/test_coverage_engine.py"
      - "tests/lottery/test_any_prize_coverage_engine.py"
      - ".github/workflows/exact_coverage.yml"
  workflow_dispatch:

jobs:
  exact_coverage:
    runs-on: ubuntu-latest
    # Exact-coverage multi-seed diagnostics may take >20 min on loaded runners.
    # Run #46 hit the old 20-minute cap without reporting a pytest failure.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e . pytest
      - name: Verify exact coverage calculation
        run: >-
          python -m pytest
          tests/lottery/test_portfolio_coverage.py
          tests/lottery/test_elite_portfolio_coverage.py
          tests/lottery/test_coverage_engine.py
          tests/lottery/test_any_prize_coverage_engine.py
          -q -s --durations=10
