name: P1 Operator Lotto CSV source audit (manual, code only)

on:
  pull_request:
    branches: [main]
    paths:
      - src/lrei/lottery/local_audit_manifest.py
      - src/lrei/lottery/operator_https_diagnostic.py
      - src/lrei/lottery/official_draw_source.py
      - src/lrei/lottery/archive_reconciliation.py
      - src/lrei/lottery/operator_full_window_capture.py
      - tests/lottery/test_local_audit_manifest.py
      - tests/lottery/test_operator_https_diagnostic.py
      - tests/lottery/test_official_draw_source.py
      - tests/lottery/test_archive_reconciliation.py
      - tests/lottery/test_operator_full_window_capture.py
      - .github/workflows/p1-operator-csv-audit.yml
  workflow_dispatch:
    inputs:
      candidate_dataset:
        description: "Dataset to CHECK, not to merge: main or source-gated draft PR #25/#30/#44"
        required: true
        type: choice
        default: "main"
        options:
          - main
          - source-gated-pr25
          - candidate-pr30
          - candidate-pr44

permissions:
  contents: read

jobs:
  offline-parser-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and tests
        run: python -m pip install -e . pytest
      - name: Test parser, archive reconciliation and full-window capture (synthetic only)
        run: >-
          python -m pytest -q
          tests/lottery/test_local_audit_manifest.py
          tests/lottery/test_operator_https_diagnostic.py
          tests/lottery/test_official_draw_source.py
          tests/lottery/test_archive_reconciliation.py
          tests/lottery/test_operator_full_window_capture.py

  manual-first-party-connectivity-diagnostic:
    # Diagnostic-only: does not download results or attest their authenticity.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout trusted diagnostic code from main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install trusted package
        run: python -m pip install -e .
      - name: Diagnose first-party DNS TCP TLS HTTP (never source attestation)
        shell: bash
        run: |
          mkdir -p audit-evidence
          set -o pipefail
          python -m lrei.lottery.operator_https_diagnostic | tee audit-evidence/connectivity-diagnostic.json
      - name: Preserve connectivity evidence even when TCP is blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-operator-connectivity-diagnostic
          path: audit-evidence/connectivity-diagnostic.json
          if-no-files-found: warn
          retention-days: 30

  optional-real-operator-capture:
    # This job never runs on a PR or automatically. Network access errors
    # must be reported RED rather than misrepresented as authentic results.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout trusted verification code from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Checkout candidate DATA only for comparison (never execute code)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_dataset == 'candidate-pr44' && 'data/lotto-3976-user-upload-quarantine-20261020' || (inputs.candidate_dataset == 'candidate-pr30' && 'data/lotto-candidate-3975-20261017' || (inputs.candidate_dataset == 'source-gated-pr25' && 'data/lotto-refresh-3974-20261015' || 'main')) }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install trusted checker
        run: python -m pip install -e ./trusted
      - name: Record immutable checked-out inputs (NOT source authentication)
        env:
          CANDIDATE_SELECTION: ${{ inputs.candidate_dataset }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          def head(path):
              return subprocess.check_output(
                  ["git", "-C", str(path), "rev-parse", "--verify", "HEAD"],
                  text=True,
              ).strip()

          candidate = Path("candidate/data/lottery.csv")
          # Hash precisely the candidate bytes used by the subsequent checker.
          digest = hashlib.sha256(candidate.read_bytes()).hexdigest()
          manifest = {
              "schema_version": 1,
              "status": "candidate_input_fingerprints_ONLY_NO_SOURCE_ATTESTATION",
              "candidate_selection": os.environ["CANDIDATE_SELECTION"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "candidate_checkout_commit_sha": head("candidate"),
              "trusted_checker_checkout_commit_sha": head("trusted"),
              "candidate_csv_sha256": digest,
              "candidate_csv_bytes": candidate.stat().st_size,
              "recorded_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "operator_source_provenance_verified": False,
              "candidate_matches_operator": False,
              "dataset_promotion_approved": False,
              "requires_human_review": True,
          }
          out = Path("audit-evidence/candidate-input-manifest.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          with out.open("x", encoding="utf-8") as stream:
              json.dump(manifest, stream, ensure_ascii=False, indent=2, sort_keys=True)
              stream.write("\n")
          print(json.dumps(manifest, sort_keys=True))
          PY
      - name: Fetch first-party response against candidate bytes pinned to input manifest
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(python -c 'import json, pathlib; print(json.loads(pathlib.Path("audit-evidence/candidate-input-manifest.json").read_text(encoding="utf-8"))["candidate_csv_sha256"])')"
          python -m lrei.lottery.operator_full_window_capture \
            --historical-csv candidate/data/lottery.csv \
            --expected-candidate-sha256 "$EXPECTED_SHA" \
            --report audit-evidence/operator-full-window-report.json \
            --failure-report audit-evidence/operator-full-window-failure.json
      - name: Retain success hash or explicit non-attesting failure artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-operator-csv-audit-${{ inputs.candidate_dataset }}
          path: |
            audit-evidence/operator-full-window-report.json
            audit-evidence/operator-full-window-failure.json
            audit-evidence/candidate-input-manifest.json
          if-no-files-found: warn
          retention-days: 30
