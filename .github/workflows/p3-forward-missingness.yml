name: P3 Forward Discovery Ledger Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - data/p3_forward_missingness/**
      - src/lrei/lottery/p3_forward_missingness.py
      - src/lrei/lottery/p3_forward_screen.py
      - tests/lottery/test_p3_forward_missingness.py
      - research/protocols/p3-strong-choice-forward-screen-v1.json
      - .github/workflows/p3-forward-missingness.yml
  push:
    branches: [main]
    paths:
      - data/p3_forward_missingness/**
      - src/lrei/lottery/p3_forward_missingness.py
      - src/lrei/lottery/p3_forward_screen.py
      - tests/lottery/test_p3_forward_missingness.py
      - research/protocols/p3-strong-choice-forward-screen-v1.json
      - .github/workflows/p3-forward-missingness.yml

permissions:
  contents: read

jobs:
  discovery-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR merge ref with baseline commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and pytest
        run: python -m pip install -e . pytest

      - name: Compile and run source-gated regression tests
        run: |
          python -m compileall -q src/lrei/lottery/p3_forward_missingness.py
          python -m pytest -q tests/lottery/test_p3_forward_missingness.py

      - name: Verify proposed discovery ledger against base branch (append-only)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          path='data/p3_forward_missingness/source_blocked_candidates.json'
          # A missing baseline is not silently treated as an empty archive.
          git cat-file -e "${BASE_SHA}:${path}"
          git show "${BASE_SHA}:${path}" > "${RUNNER_TEMP}/p3-previous-ledger.json"
          python -m lrei.lottery.p3_forward_missingness \
            --ledger "${path}" \
            --previous-ledger "${RUNNER_TEMP}/p3-previous-ledger.json" \
            --protocol research/protocols/p3-strong-choice-forward-screen-v1.json

      - name: Verify main branch source discovery ledger (not source admission)
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python -m lrei.lottery.p3_forward_missingness \
            --ledger data/p3_forward_missingness/source_blocked_candidates.json \
            --protocol research/protocols/p3-strong-choice-forward-screen-v1.json
