name: P1 Reusable Prospective Batch Checks

on:
  pull_request:
    branches: [main]
    paths:
      - src/lrei/lottery/prospective_batch.py
      - tests/lottery/test_prospective_batch.py
      - .github/workflows/p1-paper-prospective.yml
      - .github/workflows/p1-reusable-batch-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-predraw-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Verify real-date, lead-time, source, no-wager and paper portfolio invariants
        run: python -m pytest -q tests/lottery/test_prospective_batch.py
